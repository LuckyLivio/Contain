name: Release capture comparison
on:
  workflow_dispatch:
    inputs:
      files:
        description: 1000 first; request 10000 to run it only after three passing 1000 trials
        default: '10000'
        type: string
      trials:
        description: Repeated paired trials (acceptance requires at least 3)
        default: '3'
        type: string
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: f8037e90658cdf46aab93d397508036ebc7c22ee
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: bef6ac17cf3c816733e661fb76dc8974f5a30f12
          path: regression
      - uses: actions/checkout@v4
        with:
          ref: f5f40ebc945b8796d238cd632667f8a1313bcb19
          path: replay-a
      - uses: actions/checkout@v4
        with:
          ref: fbaeb543d9408db589a34b285c042b96cb0584cf
          path: replay-bind
      - uses: actions/checkout@v4
        with:
          ref: e04b91d3f4bed4d552c5b62f53c84e0e50ff270e
          path: replay-light
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            candidate -> target
            baseline -> target
            regression -> target
            replay-a -> target
            replay-bind -> target
            replay-light -> target
      - name: Comparable release trials (failed quality gates retained as data)
        working-directory: candidate
        shell: pwsh
        env:
          FILES: ${{ inputs.files }}
          TRIALS: ${{ inputs.trials }}
        run: |
          ./scripts/compare-release.ps1 -BaselineDirectory ../baseline -Files 1000 -Trials ([int]$env:TRIALS) -SingleScale -Profile -RegressionDirectory ../regression -LightDirectory ../replay-light
          $file=Get-ChildItem ./target/release-comparison/run-*/comparison.json | Sort-Object LastWriteTime | Select-Object -Last 1
          $result=Get-Content -Raw $file.FullName | ConvertFrom-Json
          $normal=@($result.trials | Where-Object {$_.mode -eq 'candidate' -and $_.role -eq 'stress' -and -not $_.intentional_overload -and -not $_.file_filter_experiment})
          $passed=($normal.Count -ge 3 -and @($normal | Where-Object {-not $_.acceptance_pass}).Count -eq 0)
          if([int]$env:FILES -eq 10000 -and $passed){
            ./scripts/compare-release.ps1 -BaselineDirectory ../baseline -Files 10000 -Trials ([int]$env:TRIALS) -SingleScale -SkipExtras -Profile -RegressionDirectory ../regression -LightDirectory ../replay-light
          }else{Write-Output "10000 gate not run: requested=$env:FILES, 1000 three-trial pass=$passed"}
      - name: Synthetic disk replays (same runner, never an ETW gate)
        working-directory: candidate
        shell: pwsh
        run: |
          $output=(Resolve-Path ./target/release-comparison).Path
          foreach($trial in 1..3){
            $order=if($trial%2){@('replay-a','replay-bind','replay-light','candidate')}else{@('candidate','replay-light','replay-bind','replay-a')}
            foreach($mode in $order){
              Push-Location (Join-Path .. $mode)
              try{
                $env:CONTAIN_PROFILE_PATH=Join-Path $output "$mode-replay-$trial-profile.json"
                git rev-parse HEAD | Set-Content (Join-Path $output "$mode-replay-$trial-commit.txt")
                cargo test --release --locked -p contain-core synthetic_disk_replay -- --ignored --nocapture | Tee-Object (Join-Path $output "$mode-replay-$trial.txt")
                if($LASTEXITCODE -ne 0){throw "replay failed"}
              }finally{Pop-Location;$env:CONTAIN_PROFILE_PATH=$null}
            }
          }
      - name: Target Windows provider manifest inventory
        working-directory: candidate
        shell: pwsh
        run: ./scripts/provider-inventory.ps1 -OutputDirectory ./target/release-comparison/provider-inventory
      - name: Small release ETW fixture
        working-directory: candidate
        shell: pwsh
        run: ./scripts/demo.ps1 -RequireEtw -Release -OutputDirectory ./target/release-comparison/small-release
      - name: Strict stress acceptance (measurement failures stay red)
        working-directory: candidate
        shell: pwsh
        run: |
          foreach($file in Get-ChildItem ./target/release-comparison/run-*/comparison.json){
            $result=Get-Content -Raw $file.FullName | ConvertFrom-Json
            $normal=@($result.trials | Where-Object {$_.mode -eq 'candidate' -and $_.role -eq 'stress' -and -not $_.intentional_overload -and -not $_.file_filter_experiment})
            if($normal.Count -lt 3 -or @($normal | Where-Object {-not $_.acceptance_pass}).Count -gt 0){throw "Candidate failed frozen stress gate: $($file.FullName)"}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-capture-comparison
          path: candidate/target/release-comparison
