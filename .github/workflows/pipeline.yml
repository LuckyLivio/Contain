name: Release capture comparison
on:
  workflow_dispatch:
    inputs:
      files:
        description: Main scale (4 to 10000); 100 and 1000 are also tested
        default: '10000'
        type: string
      trials:
        description: Repeated paired trials (acceptance requires at least 3)
        default: '3'
        type: string
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: f8037e90658cdf46aab93d397508036ebc7c22ee
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: bef6ac17cf3c816733e661fb76dc8974f5a30f12
          path: regression
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            candidate -> target
            baseline -> target
            regression -> target
      - name: Comparable release trials (failed quality gates retained as data)
        working-directory: candidate
        shell: pwsh
        env:
          FILES: ${{ inputs.files }}
          TRIALS: ${{ inputs.trials }}
        run: ./scripts/compare-release.ps1 -BaselineDirectory ../baseline -Files ([int]$env:FILES) -Trials ([int]$env:TRIALS) -SingleScale -SkipExtras -Profile -RegressionDirectory ../regression
      - name: Synthetic disk replay (not an ETW gate)
        working-directory: candidate
        shell: pwsh
        run: |
          $env:CONTAIN_PROFILE_PATH="target/release-comparison/replay-profile.json"
          cargo test --release --locked -p contain-core synthetic_disk_replay -- --ignored --nocapture | Tee-Object target/release-comparison/replay.txt
          if($LASTEXITCODE -ne 0){throw "replay failed"}
      - name: Target Windows provider manifest inventory
        working-directory: candidate
        shell: pwsh
        run: ./scripts/provider-inventory.ps1 -OutputDirectory ./target/release-comparison/provider-inventory
      - name: Small release ETW fixture
        working-directory: candidate
        shell: pwsh
        run: ./scripts/demo.ps1 -RequireEtw -Release -OutputDirectory ./target/release-comparison/small-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-capture-comparison
          path: candidate/target/release-comparison
