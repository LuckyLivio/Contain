name: Accept the staged Windows prerelease candidate

on:
  push:
    branches: [feat/first-package-experience]
    paths:
      - '.github/workflows/beta05-candidate-acceptance.yml'
      - 'scripts/test-prerelease-delivery.ps1'
      - 'scripts/test-prerelease-upgrade.ps1'
      - 'scripts/test-installed-wpf-*.ps1'
      - 'scripts/test-first-package-candidate.ps1'
      - 'desktop/Contain.Desktop.Tests/**'

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_SOURCE_SHA: e85128c99caacf3180415819c7eb6668112942aa
  CANDIDATE_VERSION: 0.5.0-beta.3
  UPGRADE_BASELINE_VERSION: 0.5.0-beta.2
  UPGRADE_BASELINE_SETUP_SHA256: 4f0bd9aa89507f69e90ded3356e1c7531a4025a85b4ffbb7a662fb6ff58e7c6f
  BUILD_WORKFLOW_SHA: d4d258259a0f1165bba59913be78e1ec4209a0ee
  BUILD_RUN_ID: '44731120863'
  CANDIDATE_ARTIFACT_ID: '14626368573'
  CANDIDATE_ARCHIVE_SHA256: f687a47afaf5004972cd9fcf5b1d7500793803f8ce52f80344168684773bd91b
  CANDIDATE_MANIFEST_SHA256: a3c1d8272ba30ec597af1185ee65c2be878f0df6a831ad17fdf9108d41a41393

jobs:
  acceptance:
    runs-on: windows-2022
    name: Windows ${{ matrix.gate }} acceptance
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: stock
            receipt: prerelease-smoke.json
          - gate: upgrade
            receipt: prerelease-upgrade.json
          - gate: wpf
            receipt: installed-wpf-workflow.json
          - gate: experience-wpf
            scenario: Wpf
            receipt: first-package-candidate.json
          - gate: experience-missing-inno
            scenario: MissingInno
            receipt: first-package-candidate.json
    env:
      ACCEPTANCE_WORKFLOW_SHA: ${{ github.workflow_sha || github.sha }}
    steps:
      - name: Check out the acceptance harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Retrieve the exact staged Windows candidate
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          api = "repos/LuckyLivio/Contain/actions"
          env = os.environ
          run = json.loads(subprocess.check_output(["gh", "api", f"{api}/runs/{env['BUILD_RUN_ID']}"]))
          if (run["status"] != "completed" or run["conclusion"] != "success" or run["event"] != "push"
                  or run["head_branch"] != "feat/first-package-experience" or run["head_sha"] != env["BUILD_WORKFLOW_SHA"]
                  or run["path"] != ".github/workflows/beta05-candidate-build.yml"):
              raise SystemExit("Unexpected candidate build run")
          url = f"{api}/artifacts/{env['CANDIDATE_ARTIFACT_ID']}"
          artifact = json.loads(subprocess.check_output(["gh", "api", url]))
          if (artifact["expired"] or artifact["workflow_run"]["id"] != run["id"]
                  or artifact["name"] != f"contain-{env['CANDIDATE_VERSION']}-staged-{env['CANDIDATE_SOURCE_SHA']}"
                  or artifact["digest"] != "sha256:" + env["CANDIDATE_ARCHIVE_SHA256"]):
              raise SystemExit("Incorrect staged artifact identity")
          temp = Path(env["RUNNER_TEMP"])
          archive = temp / "staged-candidate.zip"
          with archive.open("xb") as f:
              subprocess.run(["gh", "api", url + "/zip"], stdout=f, check=True)
          with archive.open("rb") as f:
              if hashlib.file_digest(f, "sha256").hexdigest() != env["CANDIDATE_ARCHIVE_SHA256"]:
                  raise SystemExit("Downloaded artifact digest mismatch")
          candidate = temp / "candidate"
          candidate.mkdir()
          with zipfile.ZipFile(archive) as z:
              contents = z.read("SHA256SUMS.txt")
              if hashlib.sha256(contents).hexdigest() != env["CANDIDATE_MANIFEST_SHA256"]:
                  raise SystemExit("Unexpected checksum manifest")
              inventory = {n: h for h, n in (line.split("  ") for line in contents.decode("ascii").splitlines())}
              names = set(inventory) | {"SHA256SUMS.txt"}
              if (sorted(names) != sorted(z.namelist())
                      or any(Path(n).name != n or n in (".", "..") for n in names)):
                  raise SystemExit("Unexpected archive file list")
              for name in names:
                  with z.open(name) as src, (candidate / name).open("xb") as dst:
                      shutil.copyfileobj(src, dst)
          for name, expected in inventory.items():
              with (candidate / name).open("rb") as f:
                  if hashlib.file_digest(f, "sha256").hexdigest() != expected:
                      raise SystemExit(f"Digest mismatch for {name}")
          identity = json.loads((candidate / "candidate-identity.json").read_bytes())
          if identity["source_sha"] != env["CANDIDATE_SOURCE_SHA"] or identity["version"] != env["CANDIDATE_VERSION"]:
              raise SystemExit("Candidate source or version mismatch")
      - uses: actions/setup-dotnet@v4
        if: matrix.gate != 'stock'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/acceptance-dotnet
        with:
          global-json-file: global.json
      - name: Capture the native Windows PowerShell module path for the installed app
        if: matrix.gate == 'wpf' || startsWith(matrix.gate, 'experience-')
        shell: powershell
        run: |
          $null = Get-Command Get-FileHash -ErrorAction Stop
          "CONTAIN_WINDOWS_POWERSHELL_MODULE_PATH=$env:PSModulePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the compiler for the generated WPF installer
        if: matrix.gate == 'wpf' || startsWith(matrix.gate, 'experience-')
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'inno-6.7.3'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
              throw 'Inno Setup installer hash mismatch'
          }
          $install = Start-Process $installer -ArgumentList "/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$inno`"" -Wait -PassThru
          if ($install.ExitCode -ne 0 -or !(Test-Path -LiteralPath "$inno/ISCC.exe")) { throw 'Inno Setup installation failed' }
          $inno >> $env:GITHUB_PATH
          "CONTAIN_ISCC_PATH=$inno/ISCC.exe" >> $env:GITHUB_ENV
          "CONTAIN_TEST_ISCC_PATH=$inno/ISCC.exe" >> $env:GITHUB_ENV
      - name: Publish the independent UI harness
        if: matrix.gate != 'stock'
        shell: pwsh
        run: |
          if ((dotnet --version) -ne '10.0.403') { throw 'Incorrect harness SDK' }
          dotnet restore desktop/Contain.Desktop.Tests -r win-x64 --locked-mode -p:RuntimeIdentifiers=win-x64 -p:SelfContained=true
          if ($LASTEXITCODE -ne 0) { throw 'Locked UI harness restore failed' }
          dotnet publish desktop/Contain.Desktop.Tests -c Release -r win-x64 --self-contained true --no-restore -o "$env:RUNNER_TEMP/acceptance-harness"
          if ($LASTEXITCODE -ne 0) { throw 'UI harness publish failed' }
      - name: Verify both ZIPs and the installed desktop
        if: matrix.gate == 'stock'
        id: stock
        shell: pwsh
        run: |
          ./scripts/test-prerelease-delivery.ps1 -CandidateDirectory "$env:RUNNER_TEMP/candidate" -EvidenceDirectory "$env:RUNNER_TEMP/stock"
      - name: Verify the in-place upgrade from the published baseline
        if: matrix.gate == 'upgrade'
        id: upgrade
        shell: pwsh
        run: |
          ./scripts/test-prerelease-upgrade.ps1 -CandidateDirectory "$env:RUNNER_TEMP/candidate" -EvidenceDirectory "$env:RUNNER_TEMP/upgrade" `
              -HarnessPath "$env:RUNNER_TEMP/acceptance-harness/Contain.Desktop.Tests.exe" -CandidateVersion $env:CANDIDATE_VERSION `
              -BaselineVersion $env:UPGRADE_BASELINE_VERSION -BaselineSetupSha256 $env:UPGRADE_BASELINE_SETUP_SHA256
      - name: Exercise the installed WPF project workflow
        if: matrix.gate == 'wpf'
        id: wpf
        shell: pwsh
        run: |
          ./scripts/test-installed-wpf-workflow.ps1 -ExpectedVersion $env:CANDIDATE_VERSION -CandidateDirectory "$env:RUNNER_TEMP/candidate" -EvidenceDirectory "$env:RUNNER_TEMP/wpf" -HarnessPath "$env:RUNNER_TEMP/acceptance-harness/Contain.Desktop.Tests.exe"
      - name: Verify the first package through the installed desktop
        if: startsWith(matrix.gate, 'experience-')
        id: experience
        shell: pwsh
        env:
          GATE: ${{ matrix.gate }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          ./scripts/test-first-package-candidate.ps1 -CandidateDirectory "$env:RUNNER_TEMP/candidate" -EvidenceDirectory "$env:RUNNER_TEMP/$env:GATE" `
              -HarnessPath "$env:RUNNER_TEMP/acceptance-harness/Contain.Desktop.Tests.exe" -Scenario $env:SCENARIO
      - name: Upload the Windows acceptance receipt
        if: ${{ !cancelled() && (steps.stock.outcome != 'skipped' || steps.upgrade.outcome != 'skipped' || steps.wpf.outcome != 'skipped') }}
        uses: actions/upload-artifact@v4
        with:
          name: contain-${{ env.CANDIDATE_VERSION }}-windows-${{ matrix.gate }}-${{ env.CANDIDATE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.gate }}/${{ matrix.receipt }}
          if-no-files-found: error
      - name: Select the public first-package evidence
        if: ${{ !cancelled() && steps.experience.outcome != 'skipped' }}
        shell: pwsh
        env:
          GATE: ${{ matrix.gate }}
          SUCCEEDED: ${{ steps.experience.outcome == 'success' }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP $env:GATE
          $share = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/first-package-public"
          $names = @('first-package-candidate.json')
          if ($env:SUCCEEDED -eq 'true') {
              $names += 'first-package-measurement.json', 'first-launch.png', 'project-preview.png', 'package-complete.png'
              if ($env:GATE -eq 'experience-missing-inno') { $names += 'missing-inno.png' }
          }
          foreach ($name in $names) { Copy-Item -LiteralPath (Join-Path $source $name) -Destination $share }
      - name: Upload the first-package evidence
        if: ${{ !cancelled() && steps.experience.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: contain-${{ env.CANDIDATE_VERSION }}-windows-${{ matrix.gate }}-${{ env.CANDIDATE_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/first-package-public/
          if-no-files-found: error
