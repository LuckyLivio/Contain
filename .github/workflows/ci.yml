name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace
      - name: Ground truth scorer rejection cases
        shell: pwsh
        run: |
          ./scripts/test-score.ps1
          python scripts/test-score.py
          if($LASTEXITCODE -ne 0){throw 'Frozen scorer tests failed'}
          python scripts/test-commit-tail.py
          if($LASTEXITCODE -ne 0){throw 'Commit-tail diagnostic tests failed'}
      - name: ETW fixture integration
        env:
          RUST_LOG: contain_core::windows::etw=debug
        shell: pwsh
        run: ./scripts/demo.ps1 -RequireEtw -OutputDirectory ./target/demo-etw
      - name: ETW immediate-launch regression repeat
        shell: pwsh
        run: ./scripts/demo.ps1 -RequireEtw -OutputDirectory ./target/demo-etw-repeat
      - name: Snapshot fallback integration
        shell: pwsh
        run: ./scripts/demo.ps1 -SnapshotOnly -OutputDirectory ./target/demo-fallback
      - name: Publish fixture-only evidence after scoring
        if: always()
        shell: pwsh
        run: |
          foreach($label in @('demo-etw','demo-etw-repeat','demo-fallback')) {
            python scripts/hotpath-artifact.py "./target/$label" "./target/ci-fixture-public/$label" D0
            if($LASTEXITCODE -ne 0){throw 'Fixture evidence publication failed'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evidence
          path: target/ci-fixture-public
