name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace
      - name: ETW fixture integration
        env:
          RUST_LOG: contain_core::windows::etw=debug
        shell: pwsh
        run: ./scripts/demo.ps1 -RequireEtw
      - name: Snapshot fallback integration
        shell: pwsh
        run: ./scripts/demo.ps1 -SnapshotOnly
