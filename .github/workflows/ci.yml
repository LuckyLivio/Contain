name: CI
on:
  push:
    branches:
      - '**'
    # Beta tags refer to an already verified immutable package. Creating a tag
    # must not replay the source commit's opt-in GUI/ETW capture marker.
    tags-ignore:
      - '**'
    paths-ignore:
      - README.md
      - 'docs/*.md'
      - 'docs/**/*.md'
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Declare the bounded native capture plan
        id: trial_plan
        shell: pwsh
        env:
          TRIAL_PAIR_REQUESTED: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[trial-pair]') }}
          INSTALL_REQUESTED: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[desktop-install]') || contains(github.event.head_commit.message, '[stage1-beta]')) }}
          BETA_REQUESTED: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stage1-beta]') }}
          SNAPSHOT_REQUESTED: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshot-fixture]') }}
          DESKTOP_REQUESTED: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[desktop-viewer]') || (contains(github.event.head_commit.message, '[desktop-install]') || contains(github.event.head_commit.message, '[stage1-beta]'))) }}
        run: |
          $desktop = $env:DESKTOP_REQUESTED -eq 'true'
          $beta = $env:BETA_REQUESTED -eq 'true'
          "beta=$($beta.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $version = (python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$') { throw 'Invalid canonical package version' }
          "CONTAIN_VERSION=$version" >> $env:GITHUB_ENV
          "CONTAIN_PACKAGE=target/contain-$version-windows-x64.zip" >> $env:GITHUB_ENV
          $install = $env:INSTALL_REQUESTED -eq 'true'
          "install=$($install.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($desktop -and $env:TRIAL_PAIR_REQUESTED -eq 'true') { throw 'Desktop viewing and native capture are separate plans' }
          $requested = $env:TRIAL_PAIR_REQUESTED -eq 'true'
          $snapshot = $env:SNAPSHOT_REQUESTED -eq 'true'
          if ($snapshot -and ($requested -or $desktop)) { throw 'Snapshot fixture and native capture/viewer plans are separate' }
          "snapshot=$($snapshot.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "desktop=$($desktop.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "capture=$($requested.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path target/quality-public -Force | Out-Null
          [ordered]@{
            schema_version=1; source_sha=$env:GITHUB_SHA; requested=($requested -or $install)
            configurations=$(if($install){@('gui-controlled-exe')}elseif($requested){@('default','dual-clock')}else{@()}); maximum_native_captures=$(if($install){1}elseif($requested){2}else{0}); retries=0
            desktop_viewer=$desktop; desktop_install=$install; stage_one_beta=$beta
            beta_layout=$(if($desktop){@('native_default_resize_maximize_tabs_paging','simulated_150_percent_layout_stress_not_system_dpi','simulated_200_percent_layout_stress_not_system_dpi','readonly_database_identity_after_layout')}else{@()})
            install_plan=$(if($install){@('offline_protocol_arguments_and_read_only_regressions','configure_without_launch','one_gui_started_controlled_fixture_real_etw','duplicate_start_and_conservative_close','exact_session_autoopen','source_event_explain_and_export','native_picker_navigation_and_cancel_if_available')}else{@()})
            legacy_synthetic_cli=$(if($desktop){'not_run_active_doctor_excluded; native_desktop_harness_covers_read_only_views'}else{'planned'})
            snapshot_fallback=$(if($install){'explicit_snapshot_mode_offline_checks_only_no_live_fallback_substitution'}elseif($snapshot){'explicit_snapshot_fixture_requested'}else{'not_requested_not_validated'})
            status=$(if($install){'planned_after_quality_and_offline_desktop_regressions'}elseif($requested){'planned_after_quality_and_windows_report_preflights'}else{'not_requested_not_validated'})
          } | ConvertTo-Json | Set-Content target/quality-public/capture-plan.json -Encoding utf8
      - name: Restore fixed quality tool executables
        id: quality_tool_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-nextest.exe
            ~/.cargo/bin/cargo-llvm-cov.exe
            ~/.cargo/bin/cargo-deny.exe
          key: ${{ runner.os }}-contain-quality-nextest-0.9.149-llvm-cov-0.9.1-deny-0.20.2
      - name: Required quality tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = [ordered]@{ nextest='0.9.149'; 'llvm-cov'='0.9.1'; deny='0.20.2' }
          foreach ($tool in $tools.Keys) {
            & cargo $tool --version 2>$null
            if ($LASTEXITCODE -ne 0) {
              cargo install "cargo-$tool" --version $tools[$tool] --locked
              if ($LASTEXITCODE -ne 0) { throw "Installing cargo-$tool failed" }
            }
          }
      - name: Retain successfully prepared quality tools
        if: ${{ steps.quality_tool_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/cargo-nextest.exe
            ~/.cargo/bin/cargo-llvm-cov.exe
            ~/.cargo/bin/cargo-deny.exe
          key: ${{ steps.quality_tool_cache.outputs.cache-primary-key }}
      - name: Quality Check
        id: quality_check
        shell: pwsh
        run: ./scripts/quality.ps1 -Mode Check
      - name: Quality Coverage
        id: coverage
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/quality.ps1 -Mode Coverage
      - name: Original package coverage denominator
        id: original_coverage
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/quality.ps1 -Mode CoverageOriginal
      - name: Quality Dependencies
        id: dependencies
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/quality.ps1 -Mode Dependencies
      - name: Bounded companion spool regression
        id: companion
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/quality.ps1 -Mode Companion
      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: cargo build --workspace --locked
      - name: Synthetic read-only CLI integration
        id: synthetic_cli
        if: ${{ !cancelled() && steps.trial_plan.outputs.desktop != 'true' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo run -p contain-offline --bin read-only-examples --locked -- target/read-only-windows
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture generation failed' }
          python scripts/verify-read-only-cli.py --contain target/debug/contain.exe --fixtures target/read-only-windows --output target/quality/read-only-cli --public-output target/quality-public/read-only-cli
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic read-only CLI integration failed' }
          $documents = @(Get-ChildItem target/quality/read-only-cli/json -Filter '*.json')
          if ($documents.Count -ne 33) { throw 'Expected 33 actual CLI JSON documents' }
          foreach ($document in $documents) {
            if (-not (Get-Content -Raw $document.FullName | Test-Json -SchemaFile docs/schema/cli-v3.schema.json)) {
              throw 'Actual CLI output failed the existing JSON schema'
            }
          }
          Write-Host 'CLI JSON schema: 33 passed, 0 failed, 0 skipped'
      - name: Publish reviewed quality summary
        id: quality_summary
        if: always()
        shell: pwsh
        run: |
          python scripts/quality-summary.py --root . --quality target/quality --output target/quality-public/summary.json
          if ($LASTEXITCODE -ne 0) { throw 'Quality summary validation failed' }
      - name: Existing desktop SDK
        if: ${{ !cancelled() && steps.trial_plan.outputs.desktop == 'true' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the native desktop viewer and synthetic stores
        id: viewer_build
        if: ${{ !cancelled() && steps.trial_plan.outputs.desktop == 'true' && steps.quality_check.outcome == 'success' && steps.coverage.outcome == 'success' && steps.original_coverage.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.companion.outcome == 'success' && steps.build.outcome == 'success' && steps.quality_summary.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet publish desktop/Contain.Viewer/Contain.Viewer.csproj -c Release -r win-x64 --self-contained true -o target/viewer-publish
          if ($LASTEXITCODE -ne 0) { throw 'Desktop publish failed' }
          dotnet publish desktop/Contain.Viewer.Tests/Contain.Viewer.Tests.csproj -c Release -r win-x64 --self-contained true -o target/viewer-tests
          if ($LASTEXITCODE -ne 0) { throw 'Desktop test harness publish failed' }
          ./target/debug/viewer-fixtures.exe target/viewer-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic desktop fixtures failed' }
          python -c "import pathlib,shutil,sqlite3; p=pathlib.Path('target/viewer-fixtures'); shutil.copyfile(p/'empty.db',p/'future.db'); c=sqlite3.connect(p/'future.db'); c.execute('PRAGMA user_version=99'); c.close(); (p/'corrupt.db').write_bytes(b'SYNTHETIC corrupt database'); c=sqlite3.connect(p/'unrelated.db'); c.execute('CREATE TABLE unrelated(value TEXT)'); c.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Adverse database fixture setup failed' }
      - name: Freeze desktop package before native verification
        id: viewer_package
        if: ${{ !cancelled() && steps.viewer_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $packageArgs = @('scripts/package-viewer.py','prepare','--viewer','target/viewer-publish','--contain','target/debug/contain.exe','--fixtures','target/viewer-fixtures','--output','target/windows-viewer')
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -property installationPath
          if ($vsRoot) {
            $crt = Get-ChildItem -LiteralPath (Join-Path $vsRoot 'VC/Redist/MSVC') -Directory -Recurse |
              Where-Object { $_.Name -like 'Microsoft.VC*.CRT' -and $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($crt) { $packageArgs += @('--runtime-directory', $crt.FullName) }
          }
          if ('${{ steps.trial_plan.outputs.install }}' -eq 'true') { $packageArgs += @('--fixture','target/debug/contain-test-installer.exe') }
          python @packageArgs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop package freeze failed' }
      - name: Actual Windows forms, packaged CLI and local report verification
        id: viewer_verify
        if: ${{ !cancelled() && steps.viewer_package.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/viewer-private -Force | Out-Null
          # Only the controlled native harness and its children inherit this reviewed fixture temp.
          $nativePackage = [IO.Path]::GetFullPath('target/windows-viewer')
          if ('${{ steps.trial_plan.outputs.install }}' -eq 'true') {
            $nativePackage = Join-Path ('C:\Contain Desktop Package\' + $env:GITHUB_SHA.Substring(0,12)) '安装包 中文 & [x]'
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($nativePackage)) -Force | Out-Null
            Copy-Item -LiteralPath ([IO.Path]::GetFullPath('target/windows-viewer')) -Destination $nativePackage -Recurse
            $fixtureTemp = 'C:\Contain Desktop Fixture Temp'
            New-Item -ItemType Directory -Path $fixtureTemp -Force | Out-Null
            $env:TEMP = $fixtureTemp
            $env:TMP = $fixtureTemp
          }
          $testArgs = @('--package',$nativePackage,'--fixtures','target/viewer-fixtures','--output','target/viewer-public','--private-output','target/viewer-private','--source',$env:GITHUB_SHA)
          if ('${{ steps.trial_plan.outputs.install }}' -eq 'true') { $testArgs += @('--install-fixture', (Join-Path $nativePackage 'contain-test-installer.exe')) }
          ./target/viewer-tests/Contain.Viewer.Tests.exe @testArgs *> target/viewer-private/harness.log
          $code = $LASTEXITCODE
          Write-Host "Native desktop verification exit code: $code"
          if ($code -ne 0) { exit $code }
      - name: Package the frozen desktop and its actual result
        id: viewer_finalize
        if: ${{ !cancelled() && steps.viewer_package.outcome == 'success' }}
        shell: pwsh
        run: |
          $finalArgs = @('scripts/package-viewer.py','finalize','--package','target/windows-viewer','--quality-summary','target/quality-public/summary.json','--verification','target/viewer-public/summary.json','--output',$env:CONTAIN_PACKAGE)
          if ('${{ steps.trial_plan.outputs.install }}' -eq 'true') { $finalArgs += @('--install-verification','target/viewer-public/install-summary.json') }
          $finalArgs += @('--layout-verification','target/viewer-public/layout-summary.json')
          python @finalArgs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop milestone unverified; diagnostic package retains the actual failed or unexecuted checks' }
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.viewer_package.outcome == 'success' }}
        with:
          name: contain-windows-x64-viewer
          path: ${{ env.CONTAIN_PACKAGE }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.viewer_package.outcome == 'success' }}
        with:
          name: windows-viewer-evidence
          path: |
            target/viewer-public/summary.json
            target/viewer-public/install-summary.json
            target/viewer-public/layout-summary.json
            target/viewer-public/screenshots/*.png
            target/viewer-public/reports/*.html
          if-no-files-found: error
      # Only an explicitly planned push consumes the two native attempts. All
      # independent quality and Windows report preflights must pass first; documentation pushes cannot
      # accidentally repeat captures. The same frozen package runs both modes.
      - name: Freeze the Windows x64 trial package
        id: trial_package
        if: ${{ !cancelled() && steps.trial_plan.outputs.capture == 'true' && steps.quality_check.outcome == 'success' && steps.coverage.outcome == 'success' && steps.original_coverage.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.companion.outcome == 'success' && steps.build.outcome == 'success' && steps.synthetic_cli.outcome == 'success' && steps.quality_summary.outcome == 'success' }}
        shell: pwsh
        run: |
          $packageArgs = @('scripts/package-trial.py','prepare','--contain','target/debug/contain.exe','--fixture','target/debug/contain-test-installer.exe','--profile','debug','--output','target/windows-trial')
          # Copy a required redistributable from the existing MSVC installation
          # only when PE import inspection asks for it; never assume user VS tools.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -property installationPath
          if ($vsRoot) {
            $redistRoot = Join-Path $vsRoot 'VC/Redist/MSVC'
            if (Test-Path -LiteralPath $redistRoot) {
              $crt = Get-ChildItem -LiteralPath $redistRoot -Directory -Recurse |
                Where-Object { $_.Name -like 'Microsoft.VC*.CRT' -and $_.FullName -match '\\x64\\' } |
                Sort-Object FullName -Descending | Select-Object -First 1
              if ($crt) { $packageArgs += @('--runtime-directory', $crt.FullName) }
            }
          }
          python @packageArgs
          if ($LASTEXITCODE -ne 0) { throw 'Trial package dependency or identity checks failed' }
      - name: Windows filesystem report scope preflight
        id: report_paths
        if: ${{ !cancelled() && steps.trial_package.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/trial-preflight-private -Force | Out-Null
          python scripts/test-report-paths.py --summary target/quality-public/report-paths.json --private-log target/trial-preflight-private/filesystem-detail.log *> target/trial-preflight-private/filesystem.log
          $code = $LASTEXITCODE
          Write-Host "Windows filesystem report preflight exit code: $code"
          if ($code -ne 0) { exit $code }
      - name: Full synthetic report through the frozen Windows CLI
        id: report_preflight
        if: ${{ !cancelled() && steps.trial_package.outcome == 'success' && steps.report_paths.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/verify-trial-report.py --package target/windows-trial --generator target/debug/read-only-examples.exe --output target/trial-report-preflight --public-output target/quality-public/trial-report-preflight *> target/trial-preflight-private/integration.log
          $code = $LASTEXITCODE
          Write-Host "Synthetic report integration preflight exit code: $code"
          if ($code -ne 0) { exit $code }
      - name: Native trial 1 of 2 - default product path
        id: default_trial
        if: ${{ !cancelled() && steps.trial_package.outcome == 'success' && steps.report_paths.outcome == 'success' && steps.report_preflight.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/ci-etw-clock.ps1 -Phase candidate -Configuration default -AttemptIndex 1 -TrialDirectory ([IO.Path]::GetFullPath('target/windows-trial')) -OutputDirectory ([IO.Path]::GetFullPath('target/trial-default')) -PublicOutputDirectory ([IO.Path]::GetFullPath('target/trial-public-default'))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native trial 2 of 2 - dual clock evidence
        id: clock_trial
        if: ${{ !cancelled() && steps.trial_package.outcome == 'success' && steps.report_paths.outcome == 'success' && steps.report_preflight.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/ci-etw-clock.ps1 -Phase candidate -Configuration dual-clock -AttemptIndex 2 -TrialDirectory ([IO.Path]::GetFullPath('target/windows-trial')) -OutputDirectory ([IO.Path]::GetFullPath('target/trial-dual-clock')) -PublicOutputDirectory ([IO.Path]::GetFullPath('target/trial-public-dual-clock'))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Finalize the tested package and its actual validation status
        if: ${{ !cancelled() && steps.trial_package.outcome == 'success' }}
        shell: pwsh
        run: |
          foreach($scenario in @('default','dual-clock')) {
            $report = "target/trial-public-$scenario/report"
            if (Test-Path -LiteralPath $report) {
              python scripts/package-trial.py collect-report --package target/windows-trial --scenario $scenario --public-output $report
              if ($LASTEXITCODE -ne 0) { Write-Host "Report collection failed for configuration $scenario; candidate finalization will preserve the failed gate." }
            }
          }
          python scripts/package-trial.py finalize --package target/windows-trial --default-directory target/trial-default/capture --clock-directory target/trial-dual-clock/capture --clock-analysis target/trial-public-dual-clock/summary.json --quality-summary target/quality-public/summary.json --report-paths target/quality-public/report-paths.json --report-preflight target/quality-public/trial-report-preflight --output $env:CONTAIN_PACKAGE
          if ($LASTEXITCODE -ne 0) { throw 'Trial candidate is unverified; retain the diagnostic package and actual failures' }
      - name: Snapshot fallback integration
        id: fallback
        if: ${{ !cancelled() && steps.trial_plan.outputs.snapshot == 'true' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/demo.ps1 -SnapshotOnly -OutputDirectory ./target/demo-fallback
      - name: Publish fixture-only evidence after scoring
        if: ${{ !cancelled() && steps.fallback.outcome != 'skipped' }}
        shell: pwsh
        run: |
          foreach($label in @('demo-fallback')) {
            python scripts/hotpath-artifact.py "./target/$label" "./target/ci-fixture-public/$label" D0
            if($LASTEXITCODE -ne 0){throw 'Fixture evidence publication failed'}
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.fallback.outcome != 'skipped' }}
        with:
          name: fixture-evidence
          path: target/ci-fixture-public
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.trial_package.outcome == 'success' }}
        with:
          name: read-only-trial-evidence
          path: |
            target/trial-public-default
            target/trial-public-dual-clock
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.trial_package.outcome == 'success' }}
        with:
          name: contain-windows-x64-trial
          path: ${{ env.CONTAIN_PACKAGE }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-read-only-quality
          path: target/quality-public
